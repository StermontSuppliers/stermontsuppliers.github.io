name: Build product pages
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    paths: ['generate-products.mjs']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node generate-products.mjs
      - name: Save changes
        run: |
          git config user.name "product-pages-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A p c sitemap-products.xml
          git diff --cached --quiet || (git commit -m "Update product pages" && git push)
