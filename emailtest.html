<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Email test</title>
<style>body{font-family:Arial,sans-serif;max-width:480px;margin:2rem auto;padding:0 1rem}input,button{width:100%;font:inherit;padding:.8rem;margin:.4rem 0;box-sizing:border-box}button{background:#7c3aed;color:#fff;border:0;border-radius:8px;font-weight:700}pre{white-space:pre-wrap;background:#f4f4f4;padding:1rem;border-radius:8px}</style></head>
<body>
<h2>EmailJS test</h2>
<p>Type your own email and tap the button. The result shows below.</p>
<input id="to" type="email" placeholder="your@email.com">
<button id="go">Test 1: send with Zoho (service_zoho)</button>
<button id="go2">Test 2: send with Gmail (service_fdp81n2)</button>
<pre id="out">Waiting...</pre>
<script>
var KEY='PayiXKhM6gVQLHYAE', TPL='template_n60yao4';
function run(service){
  var to=document.getElementById('to').value.trim(), out=document.getElementById('out');
  if(!to){out.textContent='Type an email first.';return;}
  out.textContent='Sending with '+service+'...';
  fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({service_id:service,template_id:TPL,user_id:KEY,template_params:{
      to_email:to,email:to,to:to,reply_to:to,subject:'TEST: We received your order STM-TEST',customer_name:'Test Customer',order_ref:'STM-TEST',
      order_items:'1. Test item x1 = KSh 100',order_total:'KSh 100',delivery:'Deliver to: Test',mpesa_code:'TEST123456',order_message:'Test'}})})
  .then(function(r){return r.text().then(function(t){out.textContent=service+'\nHTTP '+r.status+'\n'+t;});})
  .catch(function(e){out.textContent='Network error: '+e.message;});
}
document.getElementById('go').onclick=function(){run('service_zoho');};
document.getElementById('go2').onclick=function(){run('service_fdp81n2');};
</script></body></html>
